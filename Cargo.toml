[package]
name = "clerk"
version = "0.1.0"
edition = "2024"
description = "Workspace manager for managed design documents"
license = "Apache-2.0"
repository = "https://github.com/invefa/Clerk"
readme = "README.md"
publish = false

[lib]
name = "clerk"
path = "src/lib.rs"

[[bin]]
name = "clerk"
path = "src/main.rs"

[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["events", "windows", "bracketed-paste"] }
regex = "1"
serde_json = "1"
sha2 = "0.10"
terminal_size = "0.4"
toml = "0.8"
unicode-segmentation = "1.13"
unicode-width = "0.2"
