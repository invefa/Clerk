name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check lints
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --locked
      - name: Build
        run: cargo build --locked
      - name: Exercise library example
        shell: pwsh
        run: ./examples/library/setup.ps1 -Destination ./target/library-demo -Clerk "$pwd/target/debug/clerk.exe"
